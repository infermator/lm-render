name: CLIPPER Browser Source Smoke

on:
  push:
    paths:
      - '.github/workflows/clipper-browser-source-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/clipper-browser
          cd /tmp/clipper-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test anonymous YouTube playback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/clipper-browser
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--autoplay-policy=no-user-gesture-required', '--disable-dev-shm-usage'],
          });
          const context = await browser.newContext({
            locale: 'en-US',
            timezoneId: 'America/New_York',
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
            viewport: { width: 1280, height: 720 },
          });
          const page = await context.newPage();
          await page.goto('https://www.youtube.com/watch?v=IzdxE1kw2ho&t=607s', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(6000);

          // Consent screens are not logins; accept if YouTube presents one.
          for (const label of ['Accept all', 'Reject all', 'I agree']) {
            const button = page.getByRole('button', { name: label }).first();
            if (await button.isVisible().catch(() => false)) {
              await button.click().catch(() => {});
              await page.waitForTimeout(2000);
              break;
            }
          }

          const result = await page.evaluate(async () => {
            const text = document.body?.innerText || '';
            const video = document.querySelector('video');
            if (!video) return { ok: false, reason: 'no_video_element', bot: /confirm you.?re not a bot/i.test(text) };
            try {
              video.muted = true;
              if (Number.isFinite(video.duration) && video.duration > 608) video.currentTime = 607;
              await video.play();
            } catch {}
            await new Promise(r => setTimeout(r, 6000));
            return {
              ok: video.readyState >= 2 && !video.paused && video.currentTime > 607.5,
              currentTime: video.currentTime,
              readyState: video.readyState,
              paused: video.paused,
              duration: video.duration,
              videoWidth: video.videoWidth,
              videoHeight: video.videoHeight,
              bot: /confirm you.?re not a bot/i.test(text),
              unavailable: /video unavailable|this video is unavailable/i.test(text),
            };
          });
          console.log(JSON.stringify(result));
          await browser.close();
          if (!result.ok) process.exit(1);
          NODE
          node smoke.mjs

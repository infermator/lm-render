name: CLIPPER Browser Source Smoke v2

on:
  push:
    paths:
      - '.github/workflows/clipper-browser-source-smoke-v2.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/clipper-browser
          cd /tmp/clipper-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Test anonymous YouTube playback
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/clipper-browser
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true, args: ['--autoplay-policy=no-user-gesture-required','--disable-dev-shm-usage'] });
          const context = await browser.newContext({
            locale: 'en-US', timezoneId: 'America/New_York',
            userAgent: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36',
            viewport: { width: 1280, height: 720 },
          });
          const page = await context.newPage();
          page.setDefaultTimeout(3000);
          try {
            await page.goto('https://www.youtube.com/watch?v=IzdxE1kw2ho&t=607s', { waitUntil: 'domcontentloaded', timeout: 30000 });
            console.log(`loaded url=${page.url()} title=${JSON.stringify(await page.title().catch(()=>''))}`);
            await page.waitForTimeout(5000);
            for (const label of ['Accept all','Reject all','I agree']) {
              const button = page.getByRole('button',{name:label}).first();
              if (await button.isVisible({timeout:1000}).catch(()=>false)) {
                console.log(`consent=${label}`);
                await button.click({timeout:1000}).catch(()=>{});
                await page.waitForTimeout(1500);
                break;
              }
            }
            const initial = await page.evaluate(() => {
              const text = document.body?.innerText || '';
              const video = document.querySelector('video');
              const player = document.querySelector('#movie_player');
              return {
                hasVideo:Boolean(video), currentTime:video?.currentTime??null, readyState:video?.readyState??null,
                paused:video?.paused??null, duration:Number.isFinite(video?.duration)?video.duration:null,
                videoWidth:video?.videoWidth??null, videoHeight:video?.videoHeight??null,
                bot:/confirm you.?re not a bot/i.test(text), signIn:/sign in/i.test(text),
                unavailable:/video unavailable|this video is unavailable/i.test(text),
                playerError:player?.querySelector('.ytp-error')?.textContent?.trim()||null,
                bodySample:text.slice(0,900).replace(/\s+/g,' '),
              };
            });
            console.log(`initial=${JSON.stringify(initial)}`);
            await page.evaluate(() => {
              const video = document.querySelector('video');
              if (!video) return;
              video.muted = true;
              try { video.currentTime = 607; } catch {}
              Promise.resolve(video.play()).catch(()=>{});
            });
            await page.waitForTimeout(8000);
            const result = await page.evaluate(() => {
              const text = document.body?.innerText || '';
              const video = document.querySelector('video');
              const player = document.querySelector('#movie_player');
              return {
                ok:Boolean(video && video.readyState>=2 && video.currentTime>607.5), hasVideo:Boolean(video),
                currentTime:video?.currentTime??null, readyState:video?.readyState??null, paused:video?.paused??null,
                duration:Number.isFinite(video?.duration)?video.duration:null, videoWidth:video?.videoWidth??null,
                videoHeight:video?.videoHeight??null, bot:/confirm you.?re not a bot/i.test(text),
                signIn:/sign in/i.test(text), unavailable:/video unavailable|this video is unavailable/i.test(text),
                playerError:player?.querySelector('.ytp-error')?.textContent?.trim()||null,
              };
            });
            console.log(`result=${JSON.stringify(result)}`);
            if (!result.ok) process.exitCode=1;
          } catch (error) {
            console.error(`browser-smoke-error=${error instanceof Error?error.message:String(error)}`);
            process.exitCode=1;
          } finally {
            await browser.close().catch(()=>{});
          }
          NODE
          timeout 90s node smoke.mjs

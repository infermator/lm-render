name: Hugging Face LipSync Probe

on:
  push:
    paths:
      - '.github/hf-lipsync-probe-kick'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover public Gradio APIs
        run: |
          python -m pip install -q --upgrade gradio_client
          python - <<'PY'
          import contextlib
          import io
          import json
          from pathlib import Path
          from gradio_client import Client

          spaces = [
              'trymonolith/MuseTalk',
              'banao-tech/musetalk-avatar',
              'fffiloni/LatentSync',
          ]
          results = {}
          for space in spaces:
              buf = io.StringIO()
              try:
                  with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
                      client = Client(space, verbose=False)
                      api = client.view_api(return_format='dict')
                  results[space] = {'ok': True, 'api': api, 'log': buf.getvalue()[-4000:]}
              except Exception as exc:
                  results[space] = {'ok': False, 'error': repr(exc), 'log': buf.getvalue()[-4000:]}
          Path('.github/last-hf-lipsync-probe.json').write_text(json.dumps(results, indent=2, default=str))
          print(json.dumps(results, indent=2, default=str))
          PY

      - name: Persist result
        if: always()
        run: |
          git config user.name reaction-lab-bot
          git config user.email actions@users.noreply.github.com
          git add .github/last-hf-lipsync-probe.json || true
          git diff --cached --quiet && exit 0
          git commit -m 'Record Hugging Face lip-sync API probe'
          git pull --rebase origin main
          git push origin HEAD:main

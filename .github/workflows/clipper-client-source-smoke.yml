name: CLIPPER Login-Free YouTube Client Smoke

on:
  push:
    paths:
      - '.github/workflows/clipper-client-source-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check --no-input 'yt-dlp[default]'
      - name: Try account-free player clients without normal watch webpage
        shell: bash
        run: |
          set -uo pipefail
          URL='https://www.youtube.com/watch?v=IzdxE1kw2ho'
          success=0
          for client in web_embedded tv android_vr web_safari ios android; do
            echo "===== client=$client ====="
            rm -f /tmp/urls.txt /tmp/media.bin
            if python -m yt_dlp --no-playlist --js-runtimes node --remote-components ejs:github \
              --extractor-args "youtube:player_client=${client};player_skip=webpage" \
              -f 'bv*+ba/b' -g "$URL" > /tmp/urls.txt; then
              MEDIA_URL="$(grep -E '^https?://' /tmp/urls.txt | head -n 1)"
              if [ -n "$MEDIA_URL" ] && curl -fsSL --range 0-65535 -o /tmp/media.bin "$MEDIA_URL"; then
                bytes="$(wc -c < /tmp/media.bin | tr -d ' ')"
                if [ "$bytes" -gt 1024 ]; then
                  echo "SUCCESS client=$client bytes=$bytes"
                  success=1
                  break
                fi
              fi
            fi
            echo "FAILED client=$client"
          done
          if [ "$success" != '1' ]; then
            echo 'No login-free player client could resolve and fetch media'
            exit 1
          fi

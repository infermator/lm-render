name: Reaction Asset Snapshot

on:
  push:
    paths:
      - '.github/assets-snapshot-kick'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Harden renderer v4
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/reaction/render-v4.mjs')
          s=p.read_text()

          old_asset="""    const asset = chooseAsset(assets, String(event.type), Number(event.intensity ?? 0.35)) || neutralAssets[neutralState.index++ % neutralAssets.length];
    const hasComment = request.voice_lipsync === true && typeof event.comment === 'string' && event.comment.trim().length > 0;
    let duration = clamp(Number(event.duration ?? 2.4), 0.8, 8);
"""
          new_asset="""    const reactionAsset = chooseAsset(assets, String(event.type), Number(event.intensity ?? 0.35)) || neutralAssets[neutralState.index++ % neutralAssets.length];
    const hasComment = request.voice_lipsync === true && typeof event.comment === 'string' && event.comment.trim().length > 0;
    const speechReadyAssets = assets.filter(candidate => candidate.enabled !== false && candidate.speech_ready === true);
    const speechAsset = hasComment
      ? (speechReadyAssets.find(candidate => candidate.reaction_type === String(event.type)) || speechReadyAssets[0] || null)
      : null;
    if (hasComment && !speechAsset) {
      throw new Error('Voice render requires one enabled speech-ready reusable avatar asset; refusing to fake lip-sync on an unvalidated reaction clip.');
    }
    const asset = speechAsset || reactionAsset;
    let duration = clamp(Number(event.duration ?? 2.4), 0.8, 8);
"""
          if old_asset in s:
              s=s.replace(old_asset,new_asset,1)

          old_comment="""        lipsync_provider: synced.provider,
        lipsync_duration: synced.duration,
      });
"""
          new_comment="""        lipsync_provider: synced.provider,
        lipsync_duration: synced.duration,
        speech_asset_id: asset.id,
        speech_asset_label: asset.label || null,
      });
"""
          if old_comment in s:
              s=s.replace(old_comment,new_comment,1)

          old_upload="""async function uploadResult(jobId, file) {
  const storagePath = `results/${jobId}.mp4`;
  const bytes = await fs.readFile(file);
"""
          new_upload="""async function uploadResult(jobId, file) {
  const renderId = `${Date.now()}-${crypto.randomBytes(4).toString('hex')}`;
  const storagePath = `results/${jobId}/${renderId}.mp4`;
  const bytes = await fs.readFile(file);
"""
          if old_upload in s:
              s=s.replace(old_upload,new_upload,1)
              s=s.replace("'x-upsert': 'true',","'x-upsert': 'false',",1)

          p.write_text(s)
          PY
          node --check scripts/reaction/render-v4.mjs
          git diff --check

      - name: Snapshot assets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MAM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['SUPABASE_URL'].rstrip('/'); key=os.environ['MAM_SUPABASE_SERVICE_ROLE_KEY']
          q=urllib.parse.urlencode({'select':'id,persona,reaction_type,label,video_url,duration_s,speech_ready,anchor_role,intensity_min,intensity_max,enabled,created_at','order':'created_at.asc'})
          req=urllib.request.Request(f'{base}/rest/v1/reaction_assets?{q}',headers={'apikey':key,'Authorization':f'Bearer {key}'})
          with urllib.request.urlopen(req,timeout=30) as r: rows=json.loads(r.read().decode())
          open('.github/reaction-assets-snapshot.json','w').write(json.dumps(rows,indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY

      - name: Commit
        run: |
          git config user.name reaction-lab-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/reaction/render-v4.mjs .github/reaction-assets-snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'Harden Reaction Lab v4 speech asset handling'
          git pull --rebase origin main
          git push origin HEAD:main

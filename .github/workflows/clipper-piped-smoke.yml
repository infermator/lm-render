name: CLIPPER Current Piped Source Smoke

on:
  push:
    paths:
      - '.github/workflows/clipper-piped-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PIPED_INSTANCES: >-
        https://pipedapi.kavin.rocks,
        https://pipedapi.leptons.xyz,
        https://pipedapi.nosebs.ru,
        https://pipedapi-libre.kavin.rocks,
        https://piped-api.privacy.com.de,
        https://pipedapi.adminforge.de,
        https://api.piped.yt,
        https://pipedapi.drgns.space,
        https://pipedapi.owo.si,
        https://pipedapi.ducks.party,
        https://piped-api.codespace.cz,
        https://pipedapi.reallyaweso.me,
        https://api.piped.private.coffee,
        https://pipedapi.darkness.services,
        https://pipedapi.orangenet.cc
      INVIDIOUS_INSTANCES: 'https://invalid.local'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Fetch exact GTA source window via current Piped instances
        run: |
          set -euo pipefail
          mkdir -p /tmp/clipper-proxy-smoke
          node scripts/clipper/piped-fetch.mjs \
            --download-sections '*607-612' \
            -o '/tmp/clipper-proxy-smoke/source.%(ext)s' \
            'https://www.youtube.com/watch?v=IzdxE1kw2ho'
          test -s /tmp/clipper-proxy-smoke/source.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/clipper-proxy-smoke/source.mp4

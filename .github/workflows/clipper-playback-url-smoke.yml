name: CLIPPER Playback URL Smoke

on:
  push:
    paths:
      - '.github/clipper-playback-smoke-kick'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE: https://reaction-lab-coral.vercel.app
      RENDER_ID: 705639c2-6ac5-40bf-a13a-adcc5eb80d89
      AUTH: ${{ secrets.BUFFER_PUSH_SECRET }}
    steps:
      - name: Verify overview signed URL
        run: |
          set -euo pipefail
          test -n "${AUTH:-}"
          curl -fsS --max-time 30 "$BASE/api/clipper/overview" \
            -H "Authorization: Bearer $AUTH" -o /tmp/overview.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/overview.json'))
          assert data.get('ok') is True, data
          storage=data.get('storage') or {}
          assert storage.get('signing_error') is None, storage
          rid=os.environ['RENDER_ID']
          row=next((r for r in data.get('renders',[]) if r.get('id')==rid), None)
          assert row, f'render {rid} missing from overview'
          assert row.get('signed_url'), f'signed_url missing: {row}'
          print('overview PASS; signing_via=%s' % storage.get('signing_via'))
          PY

      - name: Verify exact render URL and media bytes
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE/api/clipper/renders/$RENDER_ID/url" \
            -H "Authorization: Bearer $AUTH" -o /tmp/render-url.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/render-url.json'))
          assert data.get('ok') is True, data
          assert isinstance(data.get('url'), str) and data['url'].startswith('https://'), data
          print('render URL PASS; signing_via=%s' % data.get('signing_via'))
          PY
          SIGNED_URL="$(python3 -c "import json; print(json.load(open('/tmp/render-url.json'))['url'])")"
          curl -fsSL --max-time 30 --range 0-65535 "$SIGNED_URL" -o /tmp/video-sample.bin
          test "$(stat -c%s /tmp/video-sample.bin)" -gt 1024
          echo 'signed MP4 fetch PASS'

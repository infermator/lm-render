name: CLIPPER Vercel Edge Resolver Smoke

on:
  push:
    paths:
      - '.github/workflows/clipper-vercel-resolver-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve GTA V source through Reaction Lab Edge runtime
        env:
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BUFFER_PUSH_SECRET"
          HTTP_CODE="$(curl -sS -o "$RUNNER_TEMP/clipper-resolver.json" -w '%{http_code}' \
            -H "Authorization: Bearer $BUFFER_PUSH_SECRET" \
            -H 'Content-Type: application/json' \
            --data '{"video_id":"IzdxE1kw2ho","include_urls":true}' \
            'https://reaction-lab-coral.vercel.app/api/clipper/edge-source-resolve')"

          node - "$RUNNER_TEMP/clipper-resolver.json" "$RUNNER_TEMP" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const [jsonPath, dir] = process.argv.slice(2);
          const data = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          if (!data.ok || !data.video_url) {
            console.error(JSON.stringify({ok:data.ok, runtime:data.runtime, errors:data.errors}, null, 2));
            process.exit(1);
          }
          console.log(`edge resolver OK runtime=${data.runtime} resolver=${data.resolver} host=${data.video_host} muxed=${data.muxed}`);
          fs.writeFileSync(path.join(dir, 'video-url.txt'), data.video_url);
          if (data.audio_url) fs.writeFileSync(path.join(dir, 'audio-url.txt'), data.audio_url);
          NODE

          test "$HTTP_CODE" = '200'
          VIDEO_URL="$(cat "$RUNNER_TEMP/video-url.txt")"
          curl -fsSL --range 0-65535 -o "$RUNNER_TEMP/video-head.bin" "$VIDEO_URL"
          VIDEO_BYTES="$(wc -c < "$RUNNER_TEMP/video-head.bin" | tr -d ' ')"
          test "$VIDEO_BYTES" -gt 1024
          echo "edge-resolved video fetch OK bytes=$VIDEO_BYTES"

          if [ -s "$RUNNER_TEMP/audio-url.txt" ]; then
            AUDIO_URL="$(cat "$RUNNER_TEMP/audio-url.txt")"
            curl -fsSL --range 0-65535 -o "$RUNNER_TEMP/audio-head.bin" "$AUDIO_URL"
            AUDIO_BYTES="$(wc -c < "$RUNNER_TEMP/audio-head.bin" | tr -d ' ')"
            test "$AUDIO_BYTES" -gt 1024
            echo "edge-resolved audio fetch OK bytes=$AUDIO_BYTES"
          fi

name: MuseTalk Lip-sync (Kaggle Free GPU)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Public/direct URL to the reusable Kling/reaction MP4'
        required: true
        type: string
      audio_url:
        description: 'Public/direct URL to ElevenLabs speech audio'
        required: true
        type: string
      kaggle_username:
        description: 'Kaggle username (can be left blank if KAGGLE_USERNAME secret exists)'
        required: false
        default: ''
        type: string
      bbox_shift:
        description: 'MuseTalk mouth crop shift; start with 0'
        required: false
        default: '0'
        type: string

concurrency:
  group: musetalk-kaggle-free-gpu
  cancel-in-progress: false

jobs:
  lipsync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SECRET: ${{ secrets.KAGGLE_USERNAME }}
      INPUT_KAGGLE_USERNAME: ${{ inputs.kaggle_username }}
      VIDEO_URL: ${{ inputs.video_url }}
      AUDIO_URL: ${{ inputs.audio_url }}
      BBOX_SHIFT: ${{ inputs.bbox_shift }}

    steps:
      - name: Checkout renderer repo
        uses: actions/checkout@v4

      - name: Validate Kaggle auth
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo 'Missing repository secret KAGGLE_API_TOKEN.' >&2
            echo 'Create a Kaggle API token in Kaggle Settings → API and save it as this GitHub Actions secret.' >&2
            exit 1
          fi
          USERNAME="${KAGGLE_USERNAME_SECRET:-${INPUT_KAGGLE_USERNAME:-}}"
          if [ -z "$USERNAME" ]; then
            echo 'Provide kaggle_username when running the workflow, or add repository secret KAGGLE_USERNAME.' >&2
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "kernel=$USERNAME/reaction-musetalk-lipsync" >> "$GITHUB_OUTPUT"

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle>=2.0.0'
          kaggle --version

      - name: Build private Kaggle GPU job
        env:
          KAGGLE_USERNAME: ${{ steps.identity.outputs.username }}
        run: |
          set -euo pipefail
          rm -rf kaggle-job kaggle-output
          mkdir -p kaggle-job kaggle-output
          cp kaggle/musetalk_lipsync.py kaggle-job/musetalk_lipsync.py

          python - <<'PY'
          import json, os, pathlib
          folder = pathlib.Path('kaggle-job')
          folder.joinpath('job.json').write_text(json.dumps({
              'video_url': os.environ['VIDEO_URL'],
              'audio_url': os.environ['AUDIO_URL'],
              'bbox_shift': int(os.environ.get('BBOX_SHIFT') or 0),
          }, indent=2))
          folder.joinpath('kernel-metadata.json').write_text(json.dumps({
              'id': f"{os.environ['KAGGLE_USERNAME']}/reaction-musetalk-lipsync",
              'title': 'Reaction MuseTalk Lip-sync',
              'code_file': 'musetalk_lipsync.py',
              'language': 'python',
              'kernel_type': 'script',
              'is_private': True,
              'enable_gpu': True,
              'enable_tpu': False,
              'enable_internet': True,
              'dataset_sources': [],
              'kernel_sources': [],
              'competition_sources': [],
          }, indent=2))
          PY

          echo 'Prepared Kaggle job:'
          cat kaggle-job/kernel-metadata.json

      - name: Start Kaggle P100 run
        run: |
          set -euo pipefail
          kaggle kernels push -p kaggle-job --accelerator NvidiaTeslaP100 --timeout 600

      - name: Wait for Kaggle GPU result
        env:
          KERNEL: ${{ steps.identity.outputs.kernel }}
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 180); do
            status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
            echo "[$attempt/180] $status"
            lower="$(printf '%s' "$status" | tr '[:upper:]' '[:lower:]')"
            if printf '%s' "$lower" | grep -Eq 'complete|success'; then
              completed=1
              break
            fi
            if printf '%s' "$lower" | grep -Eq 'error|failed|cancel'; then
              echo 'Kaggle MuseTalk job failed.' >&2
              exit 1
            fi
            sleep 15
          done
          if [ "$completed" -ne 1 ]; then
            echo 'Timed out waiting for Kaggle GPU job.' >&2
            exit 1
          fi

      - name: Download lip-sync output
        env:
          KERNEL: ${{ steps.identity.outputs.kernel }}
        run: |
          set -euo pipefail
          kaggle kernels output "$KERNEL" -p kaggle-output -o --file-pattern '.*lipsync-result\\.(mp4|json)$'
          find kaggle-output -maxdepth 3 -type f -print
          test -f kaggle-output/lipsync-result.mp4

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: musetalk-lipsync-result
          path: |
            kaggle-output/lipsync-result.mp4
            kaggle-output/lipsync-result.json
          if-no-files-found: error
          retention-days: 7

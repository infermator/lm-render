name: Reaction Video Renderer

# MVP is intentionally manual until the MAM Supabase migration + first avatar
# asset library are installed. This prevents an empty/unmigrated production
# database from generating noisy scheduled failures. After the first end-to-end
# render is approved, add a 5-minute schedule and leave the same claim logic.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional exact reaction_jobs UUID (blank = oldest queued)'
        required: false
        default: ''

concurrency:
  group: reaction-video-renderer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone private MAM worker
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/21media-mam.git" work

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Render one reaction job
        env:
          JOB_ID: ${{ inputs.job_id }}
          MAM_BASE: 'https://21media-mam.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MAM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
        run: node work/scripts/reaction/render.mjs

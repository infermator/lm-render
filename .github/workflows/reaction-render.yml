name: Reaction Video Lab

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional exact reaction_jobs UUID (blank = oldest queued)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/render-kick'

concurrency:
  group: reaction-video-lab
  cancel-in-progress: false

jobs:
  reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install media and Kaggle tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kaggle>=2.2.0'
          ffmpeg -version | head -1
          ffprobe -version | head -1
          kaggle --version

      - name: Render one queued Reaction Lab job
        env:
          JOB_ID: ${{ inputs.job_id }}
          MAM_BASE: 'https://21media-mam.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MAM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          MUSETALK_KAGGLE_WORKER: ${{ github.workspace }}/kaggle/musetalk_lipsync.py
        run: node scripts/reaction/render-v2.mjs

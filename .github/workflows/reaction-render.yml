name: Reaction Video Lab

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional exact reaction_jobs UUID (blank = oldest queued)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/render-kick'

permissions:
  contents: write

# One worker at a time. Scheduled runs are single-shot now, so an old checkout
# cannot sit around for five minutes and claim a future job with stale code.
concurrency:
  group: reaction-video-lab-worker
  cancel-in-progress: false

jobs:
  reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Whisper weights are ~250 MB and identical between runs. Downloading
      # them every render would cost more wall clock than the transcription.
      - name: Cache Whisper weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Install media and transcription tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install 'gradio_client>=1.13.0' 'faster-whisper>=1.0.3'
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep -q ' subtitles ' && echo 'libass: yes' || echo 'libass: MISSING — captions will be skipped'
          ffprobe -version | head -1
          python3 -c 'import faster_whisper; print("faster-whisper:", faster_whisper.__version__)'
          node --check scripts/reaction/render-v4.mjs
          node --check scripts/reaction/run-v4-hardened.mjs

      - name: Resolve render target
        env:
          DISPATCH_JOB_ID: ${{ inputs.job_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          JOB_ID="${DISPATCH_JOB_ID:-}"
          FORCE_REQUEUE=0
          if [ "$EVENT_NAME" = "push" ]; then
            KICK_JOB="$(awk '/^job / { print $2 }' .github/render-kick | tail -1)"
            if [ -n "$KICK_JOB" ]; then
              JOB_ID="$KICK_JOB"
              FORCE_REQUEUE=1
            fi
          fi
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "FORCE_REQUEUE=$FORCE_REQUEUE" >> "$GITHUB_ENV"
          echo "REPLAY_JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "[reaction-worker-v4] event=$EVENT_NAME job=${JOB_ID:-queue} force_requeue=$FORCE_REQUEUE"

      - name: Render one Reaction Lab job
        env:
          MAM_BASE: 'https://21media-mam.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MAM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
          HF_MUSETALK_WORKER: ${{ github.workspace }}/scripts/reaction/hf_musetalk_lipsync.py
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          set -uo pipefail
          # Scheduled firings are throttled hard: the cron asks for every five
          # minutes and the measured median gap is 52. Draining the queue in one
          # run means a backlog clears together instead of costing an hour each.
          if [ -n "${JOB_ID:-}" ]; then
            node scripts/reaction/run-v4-hardened.mjs
            exit $?
          fi
          for pass in $(seq 1 8); do
            echo "[reaction-worker-v4] queue pass $pass"
            node scripts/reaction/run-v4-hardened.mjs
            CODE=$?
            if [ "$CODE" = "3" ]; then
              echo "[reaction-worker-v4] queue empty"
              exit 0
            fi
            if [ "$CODE" != "0" ]; then
              exit $CODE
            fi
          done

      - name: Persist diagnostic replay result
        if: always() && github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MAM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REPLAY_JOB_ID:-}" ]; then
            echo "No replay job id; skipping diagnostic snapshot"
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base = os.environ['SUPABASE_URL'].rstrip('/')
          key = os.environ['MAM_SUPABASE_SERVICE_ROLE_KEY']
          job = os.environ['REPLAY_JOB_ID']
          query = urllib.parse.urlencode({
              'id': f'eq.{job}',
              'select': 'id,status,current_stage,error,result_url,result_path,completed_at,updated_at,attempts,render_meta,reaction_plan',
          })
          req = urllib.request.Request(
              f'{base}/rest/v1/reaction_jobs?{query}',
              headers={'apikey': key, 'Authorization': f'Bearer {key}'},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              rows = json.loads(response.read().decode('utf-8'))
          payload = rows[0] if rows else {'id': job, 'status': 'missing'}
          payload['captured_at'] = __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat()
          with open('.github/last-render-diagnostic.json', 'w', encoding='utf-8') as fh:
              json.dump(payload, fh, indent=2, ensure_ascii=False)
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY

          git config user.name 'reaction-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/last-render-diagnostic.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Reaction Lab v4 replay diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main

name: Reaction Video Lab

# MVP stays manual until the first end-to-end render is approved. Default mode
# is analysis-only so a source can be visually sampled, transcribed and sent to
# the Reaction Director before any paid/reusable avatar asset library exists.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional exact reaction_jobs UUID (blank = oldest queued)'
        required: false
        default: ''
      mode:
        description: 'Analyze source first, or render with uploaded avatar assets'
        required: true
        default: 'analyze'
        type: choice
        options:
          - analyze
          - render

concurrency:
  group: reaction-video-lab
  cancel-in-progress: false

jobs:
  reaction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Clone private MAM worker
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/21media-mam.git" work

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Analyze or render one reaction job
        env:
          JOB_ID: ${{ inputs.job_id }}
          MODE: ${{ inputs.mode }}
          MAM_BASE: 'https://21media-mam.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MAM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$MODE" = "render" ]; then
            node work/scripts/reaction/render.mjs
          else
            node work/scripts/reaction/analyze.mjs
          fi

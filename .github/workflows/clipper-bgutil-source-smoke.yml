name: CLIPPER bgutil PO Token Source Smoke

on:
  push:
    paths:
      - '.github/workflows/clipper-bgutil-source-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp + bgutil plugin
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            'yt-dlp[default]' 'bgutil-ytdlp-pot-provider==1.3.1'
      - name: Start and verify bgutil provider
        run: |
          set -euo pipefail
          docker run --name bgutil-provider -d --init -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:1.3.1
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4416/ping; then
              echo
              echo 'bgutil /ping OK'
              exit 0
            fi
            sleep 1
          done
          docker logs bgutil-provider || true
          exit 1
      - name: Resolve GTA V with mweb + real PO token provider
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.youtube.com/watch?v=IzdxE1kw2ho'
          python -m yt_dlp -v --no-playlist --js-runtimes node --remote-components ejs:github \
            --extractor-args 'youtube:player_client=mweb' \
            --extractor-args 'youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416' \
            -f 'bv*+ba/b' -g "$URL" > /tmp/clipper-bgutil-urls.txt
          test -s /tmp/clipper-bgutil-urls.txt
          MEDIA_URL="$(grep -E '^https?://' /tmp/clipper-bgutil-urls.txt | head -n 1)"
          test -n "$MEDIA_URL"
          curl -fsSL --range 0-65535 -o /tmp/clipper-bgutil-head.bin "$MEDIA_URL"
          test "$(wc -c < /tmp/clipper-bgutil-head.bin | tr -d ' ')" -gt 1024
          echo "bgutil anonymous media fetch OK ($(wc -c < /tmp/clipper-bgutil-head.bin | tr -d ' ') bytes)"

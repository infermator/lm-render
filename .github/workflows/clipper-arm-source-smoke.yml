name: CLIPPER ARM64 Anonymous Source Smoke

on:
  push:
    paths:
      - '.github/workflows/clipper-arm-source-smoke.yml'

permissions:
  contents: read

jobs:
  linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact GTA V video anonymously
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'yt-dlp[default]'
          URL='https://www.youtube.com/watch?v=IzdxE1kw2ho'
          python -m yt_dlp --no-playlist --js-runtimes node --remote-components ejs:github \
            --extractor-args 'youtube:player_client=android_vr,web_embedded' \
            -f 'bv*+ba/b' -g "$URL" > /tmp/urls.txt
          MEDIA_URL="$(grep -E '^https?://' /tmp/urls.txt | head -n 1)"
          test -n "$MEDIA_URL"
          curl -fsSL --range 0-65535 -o /tmp/media.bin "$MEDIA_URL"
          bytes="$(wc -c < /tmp/media.bin | tr -d ' ')"
          test "$bytes" -gt 1024
          echo "linux-arm anonymous source OK bytes=$bytes"

  windows-arm:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact GTA V video anonymously
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input 'yt-dlp[default]'
          $url = 'https://www.youtube.com/watch?v=IzdxE1kw2ho'
          python -m yt_dlp --no-playlist --js-runtimes node --remote-components ejs:github --extractor-args 'youtube:player_client=android_vr,web_embedded' -f 'bv*+ba/b' -g $url | Set-Content -Path "$env:RUNNER_TEMP\urls.txt"
          $media = Get-Content "$env:RUNNER_TEMP\urls.txt" | Where-Object { $_ -match '^https?://' } | Select-Object -First 1
          if (-not $media) { throw 'No anonymous media URL returned' }
          Invoke-WebRequest -Uri $media -Headers @{ Range = 'bytes=0-65535' } -OutFile "$env:RUNNER_TEMP\media.bin"
          $bytes = (Get-Item "$env:RUNNER_TEMP\media.bin").Length
          if ($bytes -lt 1024) { throw "Media fetch too small: $bytes" }
          Write-Host "windows-arm anonymous source OK bytes=$bytes"

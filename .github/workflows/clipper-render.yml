name: CLIPPER Render Worker

on:
  workflow_dispatch:
    inputs:
      render_id:
        description: 'Optional exact clipper_renders UUID (blank = oldest queued)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/clipper-render.yml'
      - 'scripts/clipper/**'
      - 'scripts/reaction/transcribe_local.py'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WHISPER_MODEL: tiny
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install CLIPPER media tooling
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core curl

          # Rendering must never be held hostage by an optional caption stack.
          # yt-dlp is the only Python dependency required for the source window.
          python -m pip install --disable-pip-version-check --only-binary=:all: 'yt-dlp>=2026.8.1'

          # Captions are best-effort in render.mjs. Prefer wheels and cap setup time;
          # if Whisper cannot install quickly, the render continues without captions.
          timeout 120 python -m pip install --disable-pip-version-check --only-binary=:all: 'faster-whisper>=1.0.3' \
            || echo '[clipper-worker] faster-whisper unavailable; captions will be skipped for this run'

          yt-dlp --version
          node --version
          node --check scripts/clipper/render.mjs
          ffmpeg -hide_banner -filters | grep -q ' subtitles ' && echo 'libass: yes' || echo 'libass: missing — captions may be skipped'

      - name: Render CLIPPER queue
        env:
          MAM_BASE: 'https://reaction-lab-coral.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SHOTLEE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SHOTLEE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_ID: ${{ inputs.render_id }}
        run: |
          set -uo pipefail

          run_one() {
            if node scripts/clipper/render.mjs; then
              return 0
            else
              return $?
            fi
          }

          # Exact dispatch renders only the requested row.
          if [ -n "${RENDER_ID:-}" ]; then
            run_one
            exit $?
          fi

          # Scheduled/push workers drain a few rows. Claims are conditional in the
          # MAM API, so overlapping runners are safe and avoid one bad setup run
          # blocking the entire queue.
          for pass in $(seq 1 5); do
            echo "[clipper-worker] queue pass $pass"
            if run_one; then
              code=0
            else
              code=$?
            fi
            if [ "$code" = "3" ]; then
              echo "[clipper-worker] queue empty"
              exit 0
            fi
            if [ "$code" != "0" ]; then
              exit "$code"
            fi
          done

name: CLIPPER Render Worker

on:
  workflow_dispatch:
    inputs:
      render_id:
        description: 'Optional exact clipper_renders UUID (blank = oldest queued)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'
  # Ordinary renderer pushes must not launch a heavy smoke that competes with
  # real renders. This file is touched only when we deliberately want to kick
  # the production queue without waiting for cron.
  push:
    paths:
      - '.github/clipper-render-kick'

permissions:
  contents: read

concurrency:
  # New group intentionally does not wait behind the old smoke-shared worker.
  group: clipper-render-production-v2
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WHISPER_MODEL: tiny
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight CLIPPER media tooling
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core curl

          # Only source materialization is required before claim. Captions are
          # optional and render.mjs installs faster-whisper AFTER it has claimed
          # a captions-enabled row, so queued -> rendering is no longer blocked.
          python -m pip install --disable-pip-version-check --no-input 'yt-dlp[default]'

          yt-dlp --version
          node --version
          node --check scripts/clipper/render.mjs
          ffmpeg -version | head -1

      - name: Render CLIPPER queue
        env:
          MAM_BASE: 'https://reaction-lab-coral.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SHOTLEE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SHOTLEE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
          RENDER_ID: ${{ inputs.render_id }}
        run: |
          set -uo pipefail

          run_one() {
            if node scripts/clipper/render.mjs; then
              return 0
            else
              return $?
            fi
          }

          if [ -n "${RENDER_ID:-}" ]; then
            run_one
            exit $?
          fi

          # Scheduled/kick workers drain a few rows because GitHub cron may lag.
          for pass in $(seq 1 5); do
            echo "[clipper-worker] queue pass $pass"
            if run_one; then
              code=0
            else
              code=$?
            fi
            if [ "$code" = "3" ]; then
              echo "[clipper-worker] queue empty"
              exit 0
            fi
            if [ "$code" != "0" ]; then
              exit "$code"
            fi
          done

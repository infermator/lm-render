name: CLIPPER Render Worker

on:
  workflow_dispatch:
    inputs:
      render_id:
        description: 'Optional exact clipper_renders UUID (blank = oldest queued)'
        required: false
        default: ''
  schedule:
    - cron: '*/5 * * * *'
  # Ordinary renderer pushes must not launch a heavy smoke that competes with
  # real renders. This file is touched only when we deliberately want to kick
  # the production queue without waiting for cron.
  push:
    paths:
      - '.github/clipper-render-kick'

permissions:
  contents: read

concurrency:
  group: clipper-render-production-v2
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WHISPER_MODEL: tiny
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight CLIPPER media tooling
        timeout-minutes: 7
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core curl

          # Source materialization first; heavy caption tooling remains lazy and
          # is installed by render.mjs only after a row has actually been claimed.
          python -m pip install --disable-pip-version-check --no-input \
            'yt-dlp[default]' \
            'bgutil-ytdlp-pot-provider==1.3.1'

          # Current yt-dlp guidance recommends a PO-token provider for mweb when
          # YouTube applies BotGuard/Proof-of-Origin enforcement to datacenter IPs.
          # Run the provider locally so no third-party API or user account is
          # required for the normal path.
          docker run --name bgutil-provider -d --init -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:1.3.1

          # bgutil exposes /ping as its health endpoint. Using / here returns a
          # non-success response even when the token provider is healthy.
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo '[clipper-source] bgutil PO-token provider ready'
              break
            fi
            if [ "$i" = '20' ]; then
              echo '[clipper-source] bgutil provider did not become ready; wrapper will continue with other fallbacks'
            fi
            sleep 1
          done

          # Route every CLIPPER yt-dlp invocation through the hardened wrapper.
          sudo install -m 0755 scripts/clipper/yt-dlp-safe.sh "$(command -v yt-dlp)"

          yt-dlp --version || true
          node --version
          node --check scripts/clipper/render.mjs
          ffmpeg -version | head -1

      - name: Render CLIPPER queue
        env:
          MAM_BASE: 'https://reaction-lab-coral.vercel.app'
          BUFFER_PUSH_SECRET: ${{ secrets.BUFFER_PUSH_SECRET }}
          SHOTLEE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SHOTLEE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MAM_SUPABASE_SERVICE_ROLE_KEY }}
          CLIPPER_BGUTIL_ENABLED: '1'
          BGUTIL_BASE_URL: 'http://127.0.0.1:4416'
          # Optional last-mile fallbacks. Empty/nonexistent secrets are harmless.
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          YOUTUBE_PROXY_URL: ${{ secrets.YOUTUBE_PROXY_URL }}
          RENDER_ID: ${{ inputs.render_id }}
        run: |
          set -uo pipefail

          run_one() {
            if node scripts/clipper/render.mjs; then
              return 0
            else
              return $?
            fi
          }

          # A manually dispatched exact render should still make the Action red
          # when that exact render fails.
          if [ -n "${RENDER_ID:-}" ]; then
            run_one
            exit $?
          fi

          # Scheduled/kick workers are queue drainers, not one-row jobs. A render
          # failure is persisted by /api/clipper/complete, so continue to the next
          # row instead of leaving unrelated rows stuck in render_queued forever.
          failures=0
          for pass in $(seq 1 5); do
            echo "[clipper-worker] queue pass $pass"
            if run_one; then
              code=0
            else
              code=$?
            fi
            if [ "$code" = "3" ]; then
              echo "[clipper-worker] queue empty; recorded failures=$failures"
              exit 0
            fi
            if [ "$code" != "0" ]; then
              failures=$((failures + 1))
              echo "[clipper-worker] render failed with code $code; failure is recorded, continuing queue"
            fi
          done

          echo "[clipper-worker] drain pass limit reached; recorded failures=$failures"
          exit 0

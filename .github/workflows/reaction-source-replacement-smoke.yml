name: Reaction Source Replacement Smoke

on:
  push:
    paths:
      - '.github/source-replacement-smoke-kick'
      - 'scripts/reaction/run-v4-hardened.mjs'
      - 'scripts/reaction/render-v4.mjs'
      - 'scripts/reaction/layout-safety.mjs'
      - 'scripts/reaction/layout-safety.test.mjs'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardened runtime source replacement
        env:
          REACTION_V4_HARDEN_DRY_RUN: '1'
        run: |
          node --test scripts/reaction/layout-safety.test.mjs
          node scripts/reaction/run-v4-hardened.mjs

name: Kaggle GPU Probe

on:
  push:
    paths:
      - '.github/gpu-probe-kick'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kaggle-gpu-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install latest Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle>=2.2.3'
          kaggle --version

      - name: Capture accelerator quota
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          {
            echo '=== kaggle quota ==='
            kaggle quota 2>&1
          } | tee .github/last-kaggle-quota.txt
          exit 0

      - name: Push fresh T4 probe kernel
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          KERNEL='nililu/reaction-gpu-probe-v170'
          rm -rf /tmp/kaggle-gpu-probe /tmp/kaggle-gpu-output /tmp/kaggle-gpu-pulled
          mkdir -p /tmp/kaggle-gpu-probe /tmp/kaggle-gpu-output /tmp/kaggle-gpu-pulled
          cp kaggle/gpu_probe.py /tmp/kaggle-gpu-probe/gpu_probe.py
          cat > /tmp/kaggle-gpu-probe/kernel-metadata.json <<'JSON'
          {
            "id": "nililu/reaction-gpu-probe-v170",
            "title": "reaction-gpu-probe-v170",
            "code_file": "gpu_probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "docker_image": "gcr.io/kaggle-private-byod/python:v170",
            "docker_image_pinning_type": "original",
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "model_sources": []
          }
          JSON

          echo '=== metadata before push ==='
          cat /tmp/kaggle-gpu-probe/kernel-metadata.json
          echo '=== push ==='
          set +e
          kaggle kernels push -p /tmp/kaggle-gpu-probe --accelerator NvidiaTeslaT4 --timeout 300 > /tmp/kaggle-gpu-push.txt 2>&1
          PUSH_RC=$?
          set -e
          cat /tmp/kaggle-gpu-push.txt
          echo "push_rc=$PUSH_RC"

          kaggle kernels pull "$KERNEL" -p /tmp/kaggle-gpu-pulled -m || true
          if [ -f /tmp/kaggle-gpu-pulled/kernel-metadata.json ]; then
            cp /tmp/kaggle-gpu-pulled/kernel-metadata.json .github/last-gpu-kernel-metadata.json
          else
            printf '{"metadata_pull_missing":true}\n' > .github/last-gpu-kernel-metadata.json
          fi

          if [ "$PUSH_RC" -ne 0 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('.github/last-gpu-probe.json').write_text(json.dumps({
            'push_failed': True,
            'push': Path('/tmp/kaggle-gpu-push.txt').read_text(errors='replace')[-12000:],
          }, indent=2))
          PY
          else
            status=''
            for attempt in $(seq 1 50); do
              status="$(kaggle kernels status "$KERNEL" 2>&1 || true)"
              echo "[$attempt/50] $status"
              case "$status" in
                *COMPLETE*|*SUCCESS*|*complete*|*success*) break ;;
                *ERROR*|*FAILED*|*error*|*failed*) break ;;
              esac
              sleep 10
            done
            echo "$status" > /tmp/kaggle-gpu-status.txt
            kaggle kernels logs "$KERNEL" > /tmp/kaggle-gpu-logs.txt 2>&1 || true
            kaggle kernels output "$KERNEL" -p /tmp/kaggle-gpu-output -o || true
            if [ -f /tmp/kaggle-gpu-output/gpu-probe.json ]; then
              cp /tmp/kaggle-gpu-output/gpu-probe.json .github/last-gpu-probe.json
            else
              python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              'status': Path('/tmp/kaggle-gpu-status.txt').read_text(errors='replace') if Path('/tmp/kaggle-gpu-status.txt').exists() else 'unknown',
              'push': Path('/tmp/kaggle-gpu-push.txt').read_text(errors='replace')[-5000:] if Path('/tmp/kaggle-gpu-push.txt').exists() else '',
              'logs': Path('/tmp/kaggle-gpu-logs.txt').read_text(errors='replace')[-12000:] if Path('/tmp/kaggle-gpu-logs.txt').exists() else '',
              'output_missing': True,
          }
          Path('.github/last-gpu-probe.json').write_text(json.dumps(payload, indent=2))
          PY
            fi
          fi

          echo '=== persisted metadata ==='
          cat .github/last-gpu-kernel-metadata.json
          echo '=== probe result ==='
          cat .github/last-gpu-probe.json

      - name: Persist probe diagnostics
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'reaction-lab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/last-gpu-probe.json .github/last-kaggle-quota.txt .github/last-gpu-kernel-metadata.json || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Kaggle GPU probe diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
